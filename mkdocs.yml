theme:
  name: material
  logo: img/mascot/neutral.png
  favicon: img/favicon.png
  custom_dir: overrides
  font:
    text: Poppins
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - mascot-admonition-img
        - rr-hero-img

markdown_extensions:
  - abbr
  - md_in_html
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Currency-safe math: inline is \(...\) only, never single $ (so "$450" stays text).
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

extra_css:
  - css/extra.css
  - css/mascot.css
  - css/theme.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/charts.js
  - javascripts/impact.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  **/sim-spec.md
  **/image-prompt*.md
  **/TODO.md

watch:
  - docs
  - mkdocs.yml

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaryavvatts-lab/south-asian-culture-textbook
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Roots & Rivers'
  textbook_version: '1.1'
  development_stage: 'Complete (v1.1)'
  # The author adds Google Analytics later (needs their own GA4 ID):
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
