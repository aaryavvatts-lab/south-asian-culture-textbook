<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Interview Builder: Oral History MicroSim using p5.js 1.11.10</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* The printable plan is hidden on screen and filled in by the sim */
        #print-plan {
            display: none;
        }
        @media print {
            @page { margin: 0.6in; }
            body > *:not(#print-plan) { display: none !important; }
            #print-plan {
                display: block;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 11.5pt;
                line-height: 1.35;
                color: #000;
            }
            #print-plan h1 { font-size: 18pt; margin: 0 0 4pt 0; }
            #print-plan h2 { font-size: 13pt; margin: 12pt 0 4pt 0; border-bottom: 1px solid #555; }
            #print-plan .meta { margin: 0 0 6pt 0; }
            #print-plan .script { font-style: italic; }
            #print-plan .note { border-left: 3pt solid #000; padding-left: 6pt; }
            #print-plan .tag { font-size: 9pt; font-weight: bold; text-transform: uppercase; margin-right: 4pt; }
            #print-plan ol li { margin-bottom: 8pt; padding-bottom: 14pt; border-bottom: 1px dotted #999; page-break-inside: avoid; }
            #print-plan table { width: 100%; border-collapse: collapse; }
            #print-plan table.fields td { width: 50%; padding: 6pt 0 10pt 0; border-bottom: 1px solid #000; }
            #print-plan table.grid th, #print-plan table.grid td { border: 1px solid #444; padding: 4pt; text-align: left; vertical-align: top; }
            #print-plan table.grid td { height: 46pt; }
            #print-plan table.grid tr { page-break-inside: avoid; }
            #print-plan table.grid th:first-child { width: 6%; }
            #print-plan .foot { margin-top: 14pt; font-size: 9.5pt; }
        }
    </style>
    <script src="ch22-interview-builder.js"></script>
</head>
<body>
    <main></main>
    <br/>
    <a href=".">Back to Interview Builder Lesson Plan</a>
    <div id="print-plan"></div>
</body>
</html>
